<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>AegIs</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <div class="wordmark"><span class="ai">A</span>eg<span class="ai">I</span>s</div>
        <p>Bramka na czatach AI</p>
      </div>
      <span id="status">sprawdzam…</span>
    </header>

    <section class="panel">
      <label class="switch-row">
        <span>Włącz na czatach AI</span>
        <span class="switch"><input type="checkbox" id="enabled" checked /><span></span></span>
      </label>
      <label class="switch-row">
        <span>Zatrzymuj też PII do redakcji</span>
        <span class="switch"><input type="checkbox" id="blockOnRedact" checked /><span></span></span>
      </label>
      <label class="switch-row">
        <span>Blokuj, gdy API nie odpowiada</span>
        <span class="switch"><input type="checkbox" id="failClosed" /><span></span></span>
      </label>
    </section>

    <label>
      Adres warstwy
      <input type="url" id="apiUrl" value="http://127.0.0.1:8080" />
    </label>
    <label>
      Próg
      <input type="number" id="threshold" min="0" max="1" step="0.05" value="0.5" />
    </label>
    <label>
      Identyfikator pracownika
      <input type="text" id="employeeId" placeholder="emp_anna" />
    </label>
    <p class="hint">ChatGPT, Claude, Gemini i inne czaty. Warstwa lokalna: <code>python -m sensitive_guard serve</code></p>
    <script src="popup.js"></script>
  </body>
</html>
